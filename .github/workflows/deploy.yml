name: Deploy Search Site

on:
  push:
    branches: [pagefind]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python Dependencies
        run: pip install mkdocs mkdocs-awesome-pages-plugin mkdocs-breadcrumbs-plugin

      - name: Install Python Dependencies
        run: pip install mkdocs-material

      - name: Build MkDocs Site
        run: mkdocs build

      - name: Build Pagefind Search Index
        run: npx pagefind --site site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
