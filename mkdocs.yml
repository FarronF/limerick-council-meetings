site_name: Limerick City & County Council Meetings Minutes & Agendas
site_url: https://farronf.github.io/limerick-council-meetings/
docs_dir: docs

theme:
  name: material

plugins:
  - search
  - mkdocs-breadcrumbs-plugin:
      delimiter: ' > '
      log_level: 'WARNING'
      generate_home_index: false
      use_page_titles: false

nav:
  - Home: index.md
  - Browse Archive: meetings
  - Search Portal: search.md
