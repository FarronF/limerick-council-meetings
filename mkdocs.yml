site_name: Meeting Minutes & Agendas
docs_dir: docs

theme:
  name: mkdocs

plugins:
  - search
  - mkdocs-breadcrumbs-plugin:
      delimiter: ' > ' # separator between sections
      log_level: 'WARNING' # "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
      generate_home_index: false
      use_page_titles: false

nav:
  - Home: index.md
  - Browse Archive: meetings
  - Search Portal: search.md
